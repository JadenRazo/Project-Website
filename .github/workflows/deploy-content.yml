# The live branch contains approved production code and owner content edits.
# Activate only after review; preserve the current design and all project films.
name: Deploy live portfolio

on:
  # First activation may create a branch without a qualifying path-change push.
  # The job below still requires the live branch for every manual run.
  workflow_dispatch:
  push:
    branches: [live]
    paths:
      - frontend/**
      - raizhost/**
      - .github/workflows/deploy-content.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-live-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/live'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No environment: the OIDC role is restricted to this repo's live branch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run test:editor-compat --prefix frontend
      - run: npm run build --prefix frontend
      - name: Configure frontend-only deployment credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::919651863281:role/raizcloud-site-portfolio-editor-deploy
          aws-region: us-east-1
      - name: Preserve current homepage and publish assets before HTML
        env:
          SITE_BUCKET: raizcloud-site-portfolio-919651863281
          SITE_DISTRIBUTION: E3IBFD7PQYBK8F
        run: |
          set -euo pipefail
          mkdir -p rollback
          aws s3api head-object --bucket "${SITE_BUCKET}" --key index.html > rollback/index.metadata.json
          PREVIOUS_ETAG=$(jq -r .ETag rollback/index.metadata.json)
          aws s3api get-object --bucket "${SITE_BUCKET}" --key index.html \
            --if-match "${PREVIOUS_ETAG}" rollback/index.html > rollback/index.get.json
          aws s3 sync frontend/build/assets/ "s3://${SITE_BUCKET}/assets/" \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 sync frontend/build/media/projects/ "s3://${SITE_BUCKET}/media/projects/" \
            --cache-control 'public,max-age=31536000,immutable'
          if [ -d frontend/build/uploads ]; then
            aws s3 sync frontend/build/uploads/ "s3://${SITE_BUCKET}/uploads/" \
              --cache-control 'public,max-age=86400'
          fi
          aws s3api put-object --bucket "${SITE_BUCKET}" --key index.html \
            --body frontend/build/index.html --content-type 'text/html' \
            --cache-control 'no-cache,max-age=0,must-revalidate' --if-match "${PREVIOUS_ETAG}"
          # Retain old fingerprinted assets for open browser tabs and rollback.
          # Preserve runtime env-config.js and unrelated public objects. This job
          # never touches APIs, the messaging origin, DNS or databases.
          aws cloudfront create-invalidation --distribution-id "${SITE_DISTRIBUTION}" --paths '/*'
      - name: Retain exact homepage rollback
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-homepage-before-${{ github.sha }}
          path: rollback/
          if-no-files-found: ignore
          retention-days: 30
